<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutshell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              terracotta: "#C96F45",
              "terracotta-dark": "#A85A38",
              cream: "#F5F1EA",
              ivory: "#F0E0C8",
              espresso: "#3A2A1E",
              "warm-gray": "#8A7A6A",
              "near-black": "#1E1B16",
              sage: "#3D5A3D",
              rust: "#B5533C",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-cream text-espresso dark:bg-near-black dark:text-cream font-sans">
    <div class="mx-auto max-w-3xl px-6 py-10">
      <header class="mb-8">
        <h1 class="font-serif text-3xl font-bold text-terracotta">Nutshell</h1>
        <p class="text-warm-gray">Paste a YouTube link, download the audio, trim it down.</p>
      </header>

      <main class="space-y-6">
        <section id="download-section" class="rounded-lg bg-ivory p-6 dark:bg-near-black dark:border dark:border-warm-gray/30">
          <label for="video-url" class="mb-2 block font-medium">YouTube URL</label>
          <div class="flex gap-3">
            <input
              id="video-url"
              type="text"
              placeholder="https://www.youtube.com/watch?v=..."
              class="flex-1 rounded border border-warm-gray/40 bg-cream px-3 py-2 text-espresso focus:outline-none focus:ring-2 focus:ring-terracotta dark:bg-near-black dark:text-cream"
            />
            <button
              id="download-button"
              class="rounded bg-terracotta px-4 py-2 font-medium text-cream hover:bg-terracotta-dark disabled:opacity-50"
            >
              Download
            </button>
          </div>
          <p id="download-status" class="mt-3 text-sm text-warm-gray"></p>
          <p id="download-error" class="mt-3 text-sm text-rust hidden"></p>
        </section>

        <section id="trim-section" class="hidden rounded-lg bg-ivory p-6 dark:bg-near-black dark:border dark:border-warm-gray/30">
          <h2 class="mb-4 font-serif text-xl font-semibold">Trim</h2>
          <div id="waveform" class="rounded bg-cream dark:bg-espresso/40"></div>
          <div class="mt-4 flex items-center gap-2">
            <button
              id="skip-back-button"
              class="rounded bg-ivory px-3 py-1.5 font-medium text-espresso hover:bg-warm-gray/30 dark:bg-espresso/60 dark:text-cream"
              aria-label="Skip back 5 seconds"
            >
              «5
            </button>
            <button
              id="play-pause-button"
              class="rounded bg-terracotta px-3 py-1.5 font-medium text-cream hover:bg-terracotta-dark"
              aria-label="Play"
            >
              Play
            </button>
            <button
              id="skip-forward-button"
              class="rounded bg-ivory px-3 py-1.5 font-medium text-espresso hover:bg-warm-gray/30 dark:bg-espresso/60 dark:text-cream"
              aria-label="Skip forward 5 seconds"
            >
              5»
            </button>
          </div>
          <div class="mt-4 flex items-center gap-4 text-sm">
            <span>Start: <span id="trim-start" class="font-medium text-terracotta">0:00</span></span>
            <span>End: <span id="trim-end" class="font-medium text-terracotta">0:00</span></span>
            <button
              id="preview-button"
              class="ml-auto rounded bg-terracotta px-3 py-1.5 font-medium text-cream hover:bg-terracotta-dark"
            >
              Preview
            </button>
            <button
              id="trim-button"
              class="rounded bg-sage px-3 py-1.5 font-medium text-cream hover:opacity-90 disabled:opacity-50"
            >
              Trim
            </button>
          </div>
          <p id="trim-status" class="mt-3 text-sm text-warm-gray"></p>
          <p id="trim-error" class="mt-3 text-sm text-rust hidden"></p>
        </section>

        <section id="transcribe-section" class="hidden rounded-lg bg-ivory p-6 dark:bg-near-black dark:border dark:border-warm-gray/30">
          <h2 class="mb-4 font-serif text-xl font-semibold">Transcribe</h2>
          <fieldset class="flex items-center gap-6">
            <legend class="sr-only">Transcription method</legend>
            <label class="flex items-center gap-2">
              <input type="radio" name="transcription-method" value="api" checked />
              API (OpenAI Whisper) - costs per minute of audio
            </label>
            <label class="flex items-center gap-2 text-warm-gray">
              <input type="radio" name="transcription-method" value="local" disabled />
              Local (mlx-whisper) - coming soon
            </label>
          </fieldset>
          <button
            id="transcribe-button"
            class="mt-4 rounded bg-terracotta px-4 py-2 font-medium text-cream hover:bg-terracotta-dark disabled:opacity-50"
          >
            Transcribe
          </button>
          <p id="transcribe-status" class="mt-3 text-sm text-warm-gray"></p>
          <p id="transcribe-error" class="mt-3 text-sm text-rust hidden"></p>
          <pre id="transcript-display" class="mt-4 hidden whitespace-pre-wrap rounded bg-cream p-4 text-sm dark:bg-espresso/40"></pre>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <script src="/frontend/js/app.js"></script>
  </body>
</html>
